name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax checks
        run: |
          find api lib scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
      - name: Diff check
        run: git diff --check
